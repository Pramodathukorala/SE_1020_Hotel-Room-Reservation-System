spring.application.name=hotel-reservation
server.port=8080

# Folder for rooms.txt, customers.txt and reservations.txt (relative to where the app is started)
hotel.storage.data-dir=data
# Add sample rooms/customers only when the data files do not exist yet
hotel.storage.seed-sample-data=true

# Show friendly error pages instead of stack traces
server.error.include-stacktrace=never
server.error.whitelabel.enabled=false

spring.thymeleaf.cache=false

# Keep session IDs in cookies only (no ;jsessionid= in URLs)
server.servlet.session.tracking-modes=cookie
