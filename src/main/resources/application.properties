spring.application.name=hotel-reservation
server.port=8080

# ---------------------------------------------------------------------------
# MySQL database connection
# The database "hotel_reservation" is created automatically if it does not exist.
# The username/password are NOT stored here. Provide them with environment variables
# DB_USERNAME / DB_PASSWORD, or in a file "application-local.properties" in the
# project folder (that file is git-ignored - see application-local.properties.example).
# ---------------------------------------------------------------------------
spring.config.import=optional:file:./application-local.properties
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hotel_reservation?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Create the tables from schema.sql at start-up (CREATE TABLE IF NOT EXISTS keeps existing data)
spring.sql.init.mode=always

# Add sample rooms/customers only when the database is completely empty
hotel.seed-sample-data=true

# First admin login (only used when the admins table is empty). Set hotel.admin.password in
# application-local.properties; if it is missing, a random password is printed once in the console.
hotel.admin.username=admin

# Show friendly error pages instead of stack traces
server.error.include-stacktrace=never
server.error.whitelabel.enabled=false

spring.thymeleaf.cache=false

# Keep session IDs in cookies only (no ;jsessionid= in URLs)
server.servlet.session.tracking-modes=cookie

# Also run schema-mysql.sql (MySQL-only views) after schema.sql
spring.sql.init.platform=mysql
