<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head}"></head><body><header th:replace="~{fragments :: header}"></header><main><section class="page-heading container"><span class="eyebrow">ROOM MANAGEMENT</span><h1>Curate the collection.</h1><p>Manage room details, nightly rates and maintenance.</p></section><section class="container"><div th:replace="~{fragments :: alerts}"></div><div class="toolbar"><a href="/admin">← Hotel desk</a><a href="/admin/rooms/new" class="button">Add room +</a></div><div class="table-wrap"><table><thead><tr><th>Room</th><th>Category</th><th>Capacity</th><th>Base / nightly rate</th><th>Status</th><th>Actions</th></tr></thead><tbody><tr th:each="r : ${rooms}"><td><a th:href="@{/rooms/{id}(id=${r.id})}" th:text="${r.number}"></a></td><td th:text="${r.category}"></td><td th:text="${r.capacity}"></td><td th:text="|$${r.basePrice} / $${r.calculateNightlyRate()}|"></td><td th:text="${r.maintenance ? 'Maintenance' : 'In service'}"></td><td><div class="row-actions"><a th:href="@{/admin/rooms/{id}/edit(id=${r.id})}">Edit</a><form th:action="@{/admin/rooms/{id}/delete(id=${r.id})}" method="post" data-confirm="Delete this room? Rooms with booking history are protected."><button class="link danger">Delete</button></form></div></td></tr><tr th:if="${#lists.isEmpty(rooms)}"><td colspan="6" class="empty">No rooms yet. Add your first room.</td></tr></tbody></table></div></section></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
