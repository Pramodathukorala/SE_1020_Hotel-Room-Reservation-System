<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head}"></head><body><header th:replace="~{fragments :: header}"></header><main><section class="page-heading container"><span class="eyebrow">GUEST PROFILE</span><h1>A familiar face.</h1><p>Guest information and reservation history.</p></section><section class="container"><div th:replace="~{fragments :: alerts}"></div><div class="panel"><h2 th:text="${customer.name}"></h2><p th:text="${customer.email}"></p><p th:text="${customer.phone}"></p><div class="form-actions"><a class="button" th:href="@{/admin/customers/{id}/edit(id=${customer.id})}">Edit profile</a><a href="/book">Reserve a room ↗</a></div></div><h3 class="mt-5">Reservation history</h3><div class="table-wrap"><table><thead><tr><th>Reference / guest</th><th>Room</th><th>Stay</th><th>Total</th><th>Status</th><th>Actions</th></tr></thead><tbody><tr th:each="b : ${bookings}"><td><a th:href="@{/confirmation/{id}(id=${b.id})}" th:text="${#strings.substring(b.id,0,8)}"></a><small th:text="${hotel.customer(b.customerId).name}"></small></td><td th:text="${hotel.room(b.roomId).number}"></td><td><span th:text="${b.checkIn}"></span><small th:text="|to ${b.checkOut} · ${b.guests} guests|"></small></td><td th:text="|$${b.total}|"></td><td><span class="status" th:classappend="${b.cancelled ? 'muted' : ''}" th:text="${b.cancelled ? 'Cancelled' : 'Confirmed'}"></span></td><td><div class="row-actions" th:unless="${b.cancelled}"><a th:href="@{/book(id=${b.id})}">Edit</a><form th:action="@{/reservations/{id}/cancel(id=${b.id})}" method="post" data-confirm="Cancel this reservation?"><button class="link danger">Cancel</button></form></div><form th:if="${b.cancelled}" th:action="@{/reservations/{id}/delete(id=${b.id})}" method="post" data-confirm="Permanently delete this cancelled booking?"><button class="link danger">Delete</button></form></td></tr><tr th:if="${#lists.isEmpty(bookings)}"><td colspan="6" class="empty">No reservations to show. <a href="/book">Plan a stay ↗</a></td></tr></tbody></table></div></section></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
