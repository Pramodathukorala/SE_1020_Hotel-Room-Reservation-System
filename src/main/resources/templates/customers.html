<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head}"></head><body><header th:replace="~{fragments :: header}"></header><main><section class="page-heading container"><span class="eyebrow">GUEST DIRECTORY</span><h1>People make the place.</h1><p>Find profiles and keep guest details up to date.</p></section><section class="container"><div th:replace="~{fragments :: alerts}"></div><div class="toolbar"><form class="inline-search" action="/admin/customers"><input name="q" th:value="${q}" placeholder="Name, email or phone" aria-label="Search guests"><button class="button">Search</button></form><a class="button" href="/customers/register">Register guest +</a></div><div class="table-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Actions</th></tr></thead><tbody><tr th:each="c : ${customers}"><td><a th:href="@{/admin/customers/{id}(id=${c.id})}" th:text="${c.name}"></a></td><td th:text="${c.email}"></td><td th:text="${c.phone}"></td><td><div class="row-actions"><a th:href="@{/admin/customers/{id}/edit(id=${c.id})}">Edit</a><form th:action="@{/admin/customers/{id}/delete(id=${c.id})}" method="post" data-confirm="Delete this guest? Guests with booking history are protected."><button class="link danger">Delete</button></form></div></td></tr><tr th:if="${#lists.isEmpty(customers)}"><td colspan="4" class="empty">No guests found. <a href="/customers/register">Register a guest ↗</a></td></tr></tbody></table></div></section></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
