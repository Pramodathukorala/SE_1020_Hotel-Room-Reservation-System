<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head}"></head><body><header th:replace="~{fragments :: header}"></header><main><section class="container detail"><a href="/rooms" class="text-link">← Back to the collection</a><div class="detail-photo room-photo" th:classappend="${room.category.toLowerCase()}"></div><div class="detail-grid"><div><span class="eyebrow" th:text="|${room.category} · ROOM ${room.number}|"></span><h1>A space to exhale.</h1><p th:text="${room.description}"></p><h3>The thoughtful touches</h3><ul class="features"><li th:each="feature : ${room.roomFeatures}" th:text="${feature}"></li><li>Complimentary Wi-Fi</li><li th:text="|Accommodates ${room.capacity} guests|"></li></ul></div><aside class="panel"><span class="eyebrow">YOUR STAY, YOUR PACE</span><h2 th:text="|$${room.calculateNightlyRate()}|"></h2><p>per room, per night · USD</p><p th:if="${room.maintenance}" class="notice">This room is currently under maintenance.</p><a th:unless="${room.maintenance}" th:href="@{/book(roomId=${room.id})}" class="button full">Reserve this room ↗</a><small>Availability is confirmed when you submit your booking.</small></aside></div></section></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
