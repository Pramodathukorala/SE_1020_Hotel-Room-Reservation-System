<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head}"></head><body><header th:replace="~{fragments :: header}"></header><main><section class="page-heading container"><span class="eyebrow">YOUR RESERVATION</span><h1>A little closer to your escape.</h1><p>Keep these confirmation details for your records.</p></section><section class="container narrow"><article class="panel confirmation"><span class="confirmation-icon">✓</span><h2 th:text="${booking.cancelled ? 'Reservation cancelled' : 'Your stay is confirmed.'}"></h2><p class="reference" th:text="|Reference: ${booking.id}|"></p><dl class="summary"><dt>Guest</dt><dd th:text="${hotel.customer(booking.customerId).name}"></dd><dt>Room</dt><dd th:text="|${hotel.room(booking.roomId).category} · ${hotel.room(booking.roomId).number}|"></dd><dt>Check-in</dt><dd th:text="${booking.checkIn}"></dd><dt>Check-out</dt><dd th:text="${booking.checkOut}"></dd><dt>Guests</dt><dd th:text="${booking.guests}"></dd><dt>Total · USD</dt><dd><strong th:text="|$${booking.total}|"></strong></dd></dl><div class="form-actions"><button type="button" class="button" data-print>Print confirmation</button><a href="/reservations">Manage reservations ↗</a></div></article></section></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
