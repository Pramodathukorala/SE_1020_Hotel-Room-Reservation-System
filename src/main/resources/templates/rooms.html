<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head}"></head><body><header th:replace="~{fragments :: header}"></header><main><section class="page-heading container"><span class="eyebrow">THE ROOM COLLECTION</span><h1>Your own little escape.</h1><p>Thoughtfully designed spaces for unhurried days and restful nights.</p></section><section class="container"><form action="/rooms" class="filter-panel"><div><label for="q">Search rooms</label><input id="q" name="q" placeholder="Room number or description" th:value="${q}"></div><div><label for="category">Category</label><select id="category" name="category"><option value="">All categories</option><option th:each="c : ${ {'STANDARD','DELUXE','SUITE'} }" th:value="${c}" th:text="${c}" th:selected="${c == category}"></option></select></div><div><label for="in">Arrival</label><input id="in" name="in" type="date" th:value="${in}" th:min="${today}"></div><div><label for="out">Departure</label><input id="out" name="out" type="date" th:value="${out}" th:min="${today.plusDays(1)}"></div><button class="button">Find rooms</button><a href="/rooms">Reset</a></form><div class="section-top"><p th:text="|${#lists.size(rooms)} considered spaces|"></p><small>Rates in USD per night</small></div><div class="room-grid"><article class="room-card" th:each="room : ${rooms}"><a th:href="@{/rooms/{id}(id=${room.id})}" class="room-photo" th:classappend="${room.category.toLowerCase()}"><span class="pill" th:text="${room.category}"></span></a><div class="room-body"><div class="room-meta"><span th:text="|ROOM ${room.number}|"></span><span th:text="|Up to ${room.capacity} guests|"></span></div><h3><a th:href="@{/rooms/{id}(id=${room.id})}" th:text="|${#strings.capitalize(#strings.toLowerCase(room.category))} retreat|"></a></h3><p th:text="${room.description}"></p><div class="card-bottom"><div><strong th:text="|$${room.calculateNightlyRate()}|"></strong><small> / night</small></div><a class="text-link" th:href="@{/rooms/{id}(id=${room.id})}">Explore room ↗</a></div></div></article></div><div class="empty" th:if="${#lists.isEmpty(rooms)}"><h3>No rooms match your search.</h3><p>Try different dates or another room category.</p><a href="/rooms" class="button">View all rooms</a></div></section></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
