<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- ============ admin sidebar ============ -->
<aside th:fragment="sidebar(active)" class="admin-sidebar" id="adminSidebar" aria-label="Admin navigation">
    <a class="brand" th:href="@{/admin}">
        <span class="brand-mark">A</span>
        <span><span class="brand-name">The Aurelia</span><span class="brand-sub">Admin Console</span></span>
    </a>
    <nav class="admin-nav">
        <div class="admin-nav-label">Overview</div>
        <a th:href="@{/admin}" th:classappend="${active == 'dashboard'} ? 'active'"><i class="bi bi-grid-1x2"></i>Dashboard</a>
        <div class="admin-nav-label">Manage</div>
        <a th:href="@{/admin/rooms}" th:classappend="${active == 'rooms'} ? 'active'"><i class="bi bi-door-open"></i>Rooms</a>
        <a th:href="@{/admin/customers}" th:classappend="${active == 'customers'} ? 'active'"><i class="bi bi-people"></i>Customers</a>
        <a th:href="@{/admin/reservations}" th:classappend="${active == 'reservations'} ? 'active'"><i class="bi bi-journal-bookmark"></i>Reservations</a>
        <div class="admin-nav-label">Quick actions</div>
        <a th:href="@{/admin/reservations/new}"><i class="bi bi-calendar-plus"></i>New reservation</a>
        <a th:href="@{/admin/rooms/new}"><i class="bi bi-plus-square"></i>Add room</a>
        <a th:href="@{/admin/customers/new}"><i class="bi bi-person-plus"></i>Register customer</a>
    </nav>
    <div class="sidebar-foot">
        <div class="d-flex align-items-center gap-2 mb-3" th:if="${currentAdmin != null}">
            <span class="avatar" style="background:rgba(232,220,196,.15);color:var(--gold-soft)"><i class="bi bi-person-badge"></i></span>
            <div class="lh-sm">
                <div class="text-white small fw-medium" th:text="${currentAdmin.displayName}">Admin</div>
                <div class="small" style="opacity:.6">Administrator</div>
            </div>
        </div>
        <a class="text-reset d-flex align-items-center gap-2 mb-2" th:href="@{/}" target="_blank" rel="noopener"><i class="bi bi-box-arrow-up-right"></i>View public website</a>
        <form th:action="@{/admin/logout}" method="post">
            <button class="btn btn-sm btn-outline-light-soft w-100" type="submit"><i class="bi bi-box-arrow-right me-1"></i>Sign out</button>
        </form>
    </div>
</aside>

<!-- ============ mobile top bar ============ -->
<div th:fragment="mobileBar" class="admin-mobile-bar">
    <span class="brand-name">The Aurelia</span>
    <button class="btn btn-sm btn-outline-light-soft" type="button" data-sidebar-toggle aria-controls="adminSidebar" aria-expanded="false">
        <i class="bi bi-list"></i><span class="visually-hidden">Open menu</span>
    </button>
</div>

</body>
</html>
