<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head}"></head><body><header th:replace="~{fragments :: header}"></header><main><section class="page-heading container"><span class="eyebrow">THE RESERVATION DESK</span><h1>Every stay, in one place.</h1><p>Find, adjust or cancel your reservations.</p></section><section class="container"><div th:replace="~{fragments :: alerts}"></div><div class="toolbar"><form action="/reservations" class="inline-search"><input name="q" th:value="${q}" placeholder="Reference, guest or room" aria-label="Search reservations"><button class="button">Search</button></form><a href="/book" class="button">New reservation +</a></div><div class="table-wrap"><table><thead><tr><th>Reference / guest</th><th>Room</th><th>Stay</th><th>Total</th><th>Status</th><th>Actions</th></tr></thead><tbody><tr th:each="b : ${bookings}"><td><a th:href="@{/confirmation/{id}(id=${b.id})}" th:text="${#strings.substring(b.id,0,8)}"></a><small th:text="${hotel.customer(b.customerId).name}"></small></td><td th:text="${hotel.room(b.roomId).number}"></td><td><span th:text="${b.checkIn}"></span><small th:text="|to ${b.checkOut} · ${b.guests} guests|"></small></td><td th:text="|$${b.total}|"></td><td><span class="status" th:classappend="${b.cancelled ? 'muted' : ''}" th:text="${b.cancelled ? 'Cancelled' : 'Confirmed'}"></span></td><td><div class="row-actions" th:unless="${b.cancelled}"><a th:href="@{/book(id=${b.id})}">Edit</a><form th:action="@{/reservations/{id}/cancel(id=${b.id})}" method="post" data-confirm="Cancel this reservation?"><button class="link danger">Cancel</button></form></div><form th:if="${b.cancelled}" th:action="@{/reservations/{id}/delete(id=${b.id})}" method="post" data-confirm="Permanently delete this cancelled booking?"><button class="link danger">Delete</button></form></td></tr><tr th:if="${#lists.isEmpty(bookings)}"><td colspan="6" class="empty">No reservations to show. <a href="/book">Plan a stay ↗</a></td></tr></tbody></table></div></section></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
