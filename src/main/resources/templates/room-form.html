<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head}"></head><body><header th:replace="~{fragments :: header}"></header><main><section class="page-heading container"><span class="eyebrow">THE ROOM COLLECTION</span><h1>Every detail matters.</h1><p>Add or update a space in your hotel.</p></section><section class="container narrow"><form class="panel" action="/admin/rooms" method="post" th:object="${room}"><input type="hidden" th:field="*{id}"><div class="two-cols"><div><label for="number">Room number</label><input id="number" th:field="*{number}" pattern="[A-Za-z0-9-]{1,12}" required></div><div><label for="category">Room category</label><select id="category" name="category"><option th:each="c : ${ {'STANDARD','DELUXE','SUITE'} }" th:value="${c}" th:text="${c}" th:selected="${c == room.category}"></option></select></div></div><div class="two-cols"><div><label for="capacity">Guest capacity</label><input id="capacity" type="number" th:field="*{capacity}" min="1" max="20" required></div><div><label for="basePrice">Base price · USD</label><input id="basePrice" type="number" th:field="*{basePrice}" min="0.01" max="1000000" step="0.01" required></div></div><p class="help">Nightly rate: Standard = base; Deluxe = base × 1.20; Suite = base × 1.50. Existing booking totals are preserved.</p><label for="description">Room description</label><textarea id="description" th:field="*{description}" maxlength="2000" rows="4" required></textarea><label class="checkbox"><input type="checkbox" name="maintenance" value="true" th:checked="${room.maintenance}"> Mark as under maintenance</label><div class="form-actions"><button class="button">Save room ↗</button><a href="/admin/rooms">Back to rooms</a></div></form></section></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
