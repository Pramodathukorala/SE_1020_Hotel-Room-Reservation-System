<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head}"></head><body><header th:replace="~{fragments :: header}"></header><main><section class="page-heading container"><span class="eyebrow">GUEST PROFILES</span><h1>A warm welcome starts here.</h1><p>Create or update your guest profile before reserving a room.</p></section><section class="container narrow"><form action="/customers" method="post" class="panel" th:object="${customer}"><input type="hidden" th:field="*{id}"><label for="name">Full name</label><input id="name" th:field="*{name}" minlength="2" maxlength="100" autocomplete="name" required><label for="email">Email address</label><input id="email" type="email" th:field="*{email}" maxlength="200" autocomplete="email" required><label for="phone">Phone number</label><input id="phone" type="tel" th:field="*{phone}" placeholder="+94 77 123 4567" autocomplete="tel" required><div class="form-actions"><button class="button">Save guest profile ↗</button><a href="/admin/customers">Guest directory</a></div></form></section></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
