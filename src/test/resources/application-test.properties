# Used by WebFlowTest (@ActiveProfiles("test")): an in-memory H2 database in MySQL mode
# replaces MySQL, so the tests run on any machine without a database server.
spring.datasource.url=jdbc:h2:mem:hotel-webtest;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# H2 does not need the MySQL-only views (schema-mysql.sql is skipped)
spring.sql.init.platform=h2

# Admin created for the web tests
hotel.admin.username=admin
hotel.admin.password=TestAdmin123
